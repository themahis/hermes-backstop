name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh
      - run: pip install pytest fastapi
      - run: pytest -q
      - run: node --test tests/desktop.test.cjs
  validate:
    # The catalog's admission gate, installed the way the catalog CI does it, on the latest release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.23.0
      - uses: actions/checkout@v4
        with:
          path: _plugin/backstop
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          extras: '[]'
      - run: timeout 600 hermes plugins validate --install-deps "$GITHUB_WORKSPACE/_plugin/backstop" </dev/null
